<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Color Picker</title>
    <style>
        #colorPreview {
            width: 200px;
            height: 200px;
            margin: 20px 0;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #colorHistory {
            list-style: none;
            padding: 0;
        }
        #colorHistory li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
     <h1>Interactive Color Picker</h1>
    <label for="colorPicker"> choose a Color</label>
    <input type="color" id="colorPicker">

    <div id="colorPreview"> color preview</div>
 <h2>color history</h2>
 <ul id="colorHistory"></ul>
    <button id="clearHistoryButton">clear history</button>

<script src="color.js"></script>
</body>
</html>
